# SPDX-License-Identifier: Apache-2.0 OR MIT

[licenses]
# Allowed licenses for dependencies.
# MPL-2.0: used by colored (file-level copyleft, compatible with MIT/Apache-2.0)
# AGPL-3.0: used by http-handle (dev server only, same author)
# ISC: used by some transitive deps
# BSD-2-Clause/BSD-3-Clause: used by some transitive deps
# Unicode-3.0: used by unicode data crates
# Unicode-DFS-2016: used by finl_unicode (transitive via comrak → staticdatagen);
#   the old "Unicode License Agreement - Data Files and Software" for the Unicode
#   data tables. OSI-approved. Predates Unicode-3.0; both are acceptable here.
# Zlib: used by foldhash (OSI-approved, FSF-free, permissive)
# CC0-1.0: used by tiny-keccak → const-random → dlv-list (public-domain dedication)
# NCSA: used by libfuzzer-sys (transitive via rav1e → ravif, our AVIF chain
#   added in v0.0.42). OSI-approved, FSF Free/Libre, BSD-like permissive.
# CDLA-Permissive-2.0: used by webpki-roots (transitive via ureq, our LLM
#   chain added in v0.0.42). Permissive Community Data License Agreement.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "ISC",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MITNFA",
    "AGPL-3.0-only",
    "Zlib",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# The graph highlighting used when creating dotgraphs for crates with multiple versions
highlight = "all"

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = []

# Similarly to `skip` allows you to skip certain crates during duplicate detection
skip-tree = []

[advisories]
# List of advisory IDs to ignore.
# These are unmaintained crate warnings from transitive deps in staticdatagen
# that cannot be resolved without upstream changes.
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust (unmaintained) — via syntect/comrak
    "RUSTSEC-2024-0436", # paste (unmaintained) — via dtt
    "RUSTSEC-2025-0141", # bincode (unmaintained) — via syntect
    # The quick-xml <0.41 DoS pair (RUSTSEC-2026-0194 / -0195) and the
    # proc-macro-error2 unmaintained advisory (RUSTSEC-2026-0173) were
    # removed in v0.0.50: no crate in the graph matches them any more. The
    # quick-xml removal plan recorded here on 2026-07-04 has completed.
    # rkyv 0.7.46: shared-pointer validation in the checked `access` API can
    # read out of bounds on an archive containing Rc/Arc. Fixed in 0.8.17,
    # which is not reachable: the only path is lightningcss 1.0.0-alpha.72 →
    # parcel_sourcemap 2.1.1 → rkyv 0.7, and lightningcss has not moved to
    # rkyv 0.8. lightningcss uses rkyv for its own build-time sourcemap
    # data; ssg never deserialises an rkyv archive from user input, so the
    # unsound path is unreachable here. Revisit when lightningcss updates.
    "RUSTSEC-2026-0235",
]
