id = "RUSTSEC-2026-0235" # rkyv 0.7 shared-pointer validation
reason = """
Not reachable in a default build. rkyv enters only through the optional `minify` feature: lightningcss -> parcel_sourcemap -> rkyv 0.7.46. `cargo tree -i rkyv` finds nothing without it.

Not fixable here either. lightningcss needs rkyv 0.8.17+ and is still on 1.0.0-alpha.72; minify-html 0.18.1 depends on lightningcss with default features and exposes no feature flag to drop `sourcemap`, so setting `default-features = false` on our own lightningcss dependency changes nothing under cargo's feature unification. That was measured, not assumed. 0.18.1 is the latest release.

The unsound path is unreachable regardless: it is in the checked `access` API for archives containing Rc/Arc, and ssg never deserialises an rkyv archive from user input. lightningcss uses rkyv for its own build-time sourcemap data.

Revisit when lightningcss moves to rkyv 0.8, or when minify-html gains a feature flag for it.
"""
