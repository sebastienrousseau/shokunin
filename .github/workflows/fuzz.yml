# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Nightly libFuzzer runs over the cargo-fuzz harness in fuzz/
# (v0.0.47 plan §3 item 2.1, issue #566).
#
# Each target runs for 300 s in fork mode (-fork=2). Crash / timeout /
# OOM reproducers land in fuzz/artifacts/<target>/ and are uploaded as
# workflow artifacts for triage. The harness lives outside the cargo
# workspace (fuzz/Cargo.toml has its own [workspace] table) so nightly
# + sanitizer flags never leak into the main build.

name: Fuzz

on:
  schedule:
    # Nightly at 02:30 UTC — offset from scheduled.yml to avoid
    # stacking runner load.
    - cron: "30 2 * * *"
  pull_request:
    # Only the cheap `oss-fuzz-build` job runs here (see its `if`); the
    # long libFuzzer runs stay nightly.
    paths:
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "src/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz · ${{ matrix.target }}
    # The long runs stay nightly / on demand. Adding `pull_request` to the
    # triggers above is for `oss-fuzz-build` only; without this guard every PR
    # would spawn four 60-minute libFuzzer jobs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_frontmatter
          - fuzz_markdown
          - fuzz_shortcodes
          - fuzz_html_rewrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: fuzz
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }} (300 s, fork mode)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -fork=2 \
            -max_total_time=300 \
            -timeout=30

      - name: Upload crash artifacts
        # Only exists if libFuzzer found a crash/timeout/OOM; the step
        # above will have failed, so gate on always() and tolerate an
        # empty directory.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  # Proves the OSS-Fuzz entry point still builds every declared target, and
  # that the assets libFuzzer reads at runtime are well-formed.
  #
  # Both halves are here because both have failed silently. A malformed
  # dictionary makes libFuzzer print one line and exit 0, so a nightly run
  # goes green having fuzzed nothing; and the build script's own success
  # message was once derived from the target list rather than the artefacts,
  # so it reported "built 4 fuzzer(s)" with an empty output directory.
  oss-fuzz-build:
    name: OSS-Fuzz build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: oss-fuzz-build

      - name: Validate fuzzing assets
        # Stable toolchain is fine here; this reads files, it does not build
        # instrumented binaries.
        run: cargo test --test fuzz_assets

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every target through the OSS-Fuzz entry point
        env:
          OUT: ${{ runner.temp }}/fuzz-out
          SANITIZER: address
        run: bash fuzz/oss-fuzz-build.sh

      # ── Regression corpus replay (issue #566, REPO-STANDARD §6) ──
      #
      # Every input in `fuzz/corpus/<target>/` is replayed on every push.
      # These are seeds and, more importantly, the reproducers for bugs
      # already found and fixed — an a11y panic on non-ASCII input among
      # them. Replaying them is what makes the corpus a regression suite
      # rather than a pile of bytes that only nightly fuzzing ever reads.
      #
      # `-runs=0` replays each file exactly once and exits: deterministic,
      # a few seconds, and it cannot flake. That is the difference from
      # the exploratory run below, which fuzzes from scratch and would
      # not notice a previously-fixed crash coming back.
      - name: Replay the committed regression corpus
        run: |
          set -euo pipefail
          cd "$OUT"
          replayed=0
          for zipfile in *_seed_corpus.zip; do
            [ -e "$zipfile" ] || continue
            target="${zipfile%_seed_corpus.zip}"
            [ -x "./$target" ] || continue
            dir="$(mktemp -d)"
            unzip -qo "$zipfile" -d "$dir"
            count=$(find "$dir" -type f | wc -l | tr -d ' ')
            echo "==> $target: replaying $count committed input(s)"
            ./"$target" "$dir" -runs=0
            replayed=$((replayed + count))
          done
          # A replay that replayed nothing is the failure this whole file
          # guards against: green, and asserting nothing.
          if [ "$replayed" -eq 0 ]; then
            echo "::error::no corpus inputs were replayed — the seed" \
                 "corpora are missing from \$OUT, so this gate passed" \
                 "without testing anything"
            exit 1
          fi
          echo "replayed $replayed committed input(s) with no crash"

      - name: Smoke-run each fuzzer
        # A binary that links but exits immediately is not a fuzzer. Ten
        # seconds each is enough to prove the dictionary parses and the
        # target reaches its entry point.
        env:
          OUT: ${{ runner.temp }}/fuzz-out
        run: |
          set -euo pipefail
          cd "$OUT"
          for bin in fuzz_*; do
            [[ -x "$bin" && "$bin" != *.dict && "$bin" != *.zip ]] || continue
            echo "==> $bin"
            ./"$bin" -max_total_time=10 -print_final_stats=1 2>&1 | tail -3
          done
