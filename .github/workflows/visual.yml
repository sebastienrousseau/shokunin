name: "\U0001F4F8 Visual Regression"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Update baseline screenshots"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    name: Screenshot diff (3 viewports)
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes updated baselines when update_baselines=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build SSG
        run: cargo build --release

      - name: Build example site
        run: cargo run --release -- -c examples/content/en -o examples/public -t examples/templates/en

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests/visual
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run visual tests
        working-directory: tests/visual
        run: |
          # Always update snapshots — baselines are informational,
          # not blocking. Diff artifacts are uploaded for review.
          npx playwright test --update-snapshots
        continue-on-error: true

      - name: Upload diff screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: tests/visual/test-results/
          retention-days: 7

      - name: Run accessibility audit
        working-directory: tests/visual
        run: npx playwright test a11y.spec.ts --project=desktop

      - name: Upload a11y reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-reports
          path: tests/visual/a11y-reports/
          retention-days: 30

      - name: Update baselines
        if: github.event.inputs.update_baselines == 'true'
        working-directory: tests/visual
        run: |
          npx playwright test --update-snapshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ../visual-baselines/
          git commit -m "test: update visual baselines" || true
          git push
