# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Release pipeline. Triggered by `git tag v<version> && git push --tags`.
#
# Output artifacts (all signed with SHA256, sigstore attestation, and
# detached GPG signature where the GPG_PRIVATE_KEY secret is set):
#
#   Linux glibc x86_64       ssg-vX.Y.Z-x86_64-unknown-linux-gnu.tar.gz
#                            ssg_X.Y.Z_amd64.deb
#                            ssg-X.Y.Z-1.x86_64.rpm
#   Linux musl x86_64        ssg-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz
#   macOS Apple Silicon      ssg-vX.Y.Z-aarch64-apple-darwin.tar.gz
#                            ssg-X.Y.Z-aarch64.pkg
#   macOS Intel              ssg-vX.Y.Z-x86_64-apple-darwin.tar.gz
#                            ssg-X.Y.Z-x86_64.pkg
#   Windows MSVC x86_64      ssg-vX.Y.Z-x86_64-pc-windows-msvc.zip
#                            ssg-X.Y.Z-x86_64.msi
#   Container                ghcr.io/sebastienrousseau/static-site-generator:vX.Y.Z
#                            ghcr.io/sebastienrousseau/static-site-generator:latest
#   AUR                      static-site-generator-X.Y.Z (gated on AUR_SSH_KEY secret)
#   crates.io                ssg X.Y.Z
#
# Secrets used:
#   GITHUB_TOKEN              built-in        (release upload, GHCR push)
#   CARGO_REGISTRY_TOKEN      required         (crates.io publish)
#   GPG_PRIVATE_KEY           optional         (artifact signatures — skipped if absent)
#   GPG_PASSPHRASE            optional         (companion to GPG_PRIVATE_KEY)
#   AUR_SSH_KEY               optional         (AUR publish — skipped if absent)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Detect optional secrets so downstream jobs can gate on them ────
  # GitHub forbids `secrets.*` in job-level `if:`, so this job exposes
  # the existence of GPG / AUR secrets as boolean outputs.
  secrets-presence:
    name: detect optional secrets
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      has_gpg: ${{ steps.check.outputs.has_gpg }}
      has_aur: ${{ steps.check.outputs.has_aur }}
    steps:
      - id: check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "has_aur=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_aur=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build + per-platform package (Linux .deb/.rpm, macOS .pkg, Windows .msi) ──
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            pkg: deb_rpm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            pkg: macos
            arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            pkg: macos
            arch: x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            pkg: msi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ── Generic archive ─────────────────────────────────────────
      - name: Archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BIN=target/${{ matrix.target }}/release/ssg
          ARCHIVE=ssg-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz
          chmod +x "$BIN"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BIN = "target/${{ matrix.target }}/release/ssg.exe"
          $ARCHIVE = "ssg-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BIN -DestinationPath $ARCHIVE
          $hash = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ascii "$ARCHIVE.sha256"

      # ── Linux: .deb + .rpm ──────────────────────────────────────
      - name: Build .deb
        if: matrix.pkg == 'deb_rpm'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/${{ matrix.target }}/release/ssg" target/release/ssg
          sh packaging/deb/build.sh "$VERSION" amd64
          shasum -a 256 "ssg_${VERSION}_amd64.deb" > "ssg_${VERSION}_amd64.deb.sha256"

      - name: Install cargo-generate-rpm
        if: matrix.pkg == 'deb_rpm'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm
        if: matrix.pkg == 'deb_rpm'
        run: |
          cargo generate-rpm --target ${{ matrix.target }}
          mv "target/${{ matrix.target }}/generate-rpm/"*.rpm . || true
          for rpm in *.rpm; do
            [ -f "$rpm" ] && shasum -a 256 "$rpm" > "$rpm.sha256"
          done

      # ── macOS: .pkg ─────────────────────────────────────────────
      - name: Build .pkg (macOS)
        if: matrix.pkg == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p root/usr/local/bin
          cp target/${{ matrix.target }}/release/ssg root/usr/local/bin/
          chmod +x root/usr/local/bin/ssg
          PKG="ssg-${VERSION}-${{ matrix.arch }}.pkg"
          pkgbuild --root root \
            --identifier com.sebastienrousseau.ssg \
            --version "${VERSION}" \
            --install-location / \
            "$PKG"
          shasum -a 256 "$PKG" > "$PKG.sha256"

      # ── Windows: .msi ───────────────────────────────────────────
      - name: Install cargo-wix
        if: matrix.pkg == 'msi'
        run: cargo install cargo-wix --locked

      - name: Build .msi (Windows)
        if: matrix.pkg == 'msi'
        shell: pwsh
        run: |
          # cargo-wix expects a wix/main.wxs template; if absent, generate one.
          if (-not (Test-Path "wix/main.wxs")) { cargo wix init --force -p ssg }
          cargo wix -p ssg --no-build --target ${{ matrix.target }} --output ssg-${env:GITHUB_REF_NAME}-x86_64.msi
          $msi = "ssg-${env:GITHUB_REF_NAME}-x86_64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $msi" | Out-File -Encoding ascii "$msi.sha256"

      # ── Upload everything this matrix entry produced ────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssg-${{ matrix.target }}
          path: |
            ssg-*.tar.gz
            ssg-*.tar.gz.sha256
            ssg-*.zip
            ssg-*.zip.sha256
            ssg_*.deb
            ssg_*.deb.sha256
            ssg-*.rpm
            ssg-*.rpm.sha256
            ssg-*.pkg
            ssg-*.pkg.sha256
            ssg-*.msi
            ssg-*.msi.sha256
          if-no-files-found: ignore
          retention-days: 7

  # ── GHCR container image ────────────────────────────────────────
  ghcr:
    name: ghcr · linux/amd64
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          # ARM64 cross-compile via QEMU is too slow for CI; build
          # AMD64 only. ARM64 support can be added when native ARM
          # runners are available.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sebastienrousseau/static-site-generator:${{ github.ref_name }}
            ghcr.io/sebastienrousseau/static-site-generator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GPG sign all release artifacts ──────────────────────────────
  gpg-sign:
    name: gpg sign · all artifacts
    needs: [build, secrets-presence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ needs.secrets-presence.outputs.has_gpg == 'true' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign every release artifact
        run: |
          set -euo pipefail
          for f in artifacts/*.tar.gz artifacts/*.zip artifacts/*.deb \
                   artifacts/*.rpm artifacts/*.pkg artifacts/*.msi; do
            [ -f "$f" ] || continue
            gpg --batch --yes --armor --detach-sign "$f"
          done
          ls -la artifacts/*.asc

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpg-signatures
          path: artifacts/*.asc
          retention-days: 7

  # ── AUR publish (gated on AUR_SSH_KEY secret) ───────────────────
  aur:
    name: aur · publish
    needs: [build, secrets-presence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ needs.secrets-presence.outputs.has_aur == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
      - name: Update PKGBUILD pkgver and push
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The Arch package name (`ssg`, set in PKGBUILD) governs the AUR
          # repository URL — not the GitHub repo name. Repo: aur/ssg.git.
          git clone ssh://aur@aur.archlinux.org/ssg.git aur-repo \
            -c core.sshCommand="ssh -i ~/.ssh/aur"
          cp packaging/arch/PKGBUILD aur-repo/PKGBUILD
          cd aur-repo
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Generate .SRCINFO via Arch container so we don't need makepkg locally
          docker run --rm -v "$(pwd):/pkg" archlinux:latest \
            bash -c 'cd /pkg && pacman -Sy --noconfirm base-devel && \
                     useradd -m b && chown -R b /pkg && \
                     su b -c "makepkg --printsrcinfo > .SRCINFO"'
          git config user.email "release-bot@example.com"
          git config user.name  "Release Bot"
          git add PKGBUILD .SRCINFO
          git commit -m "Release ${VERSION}"
          git push -c core.sshCommand="ssh -i ~/.ssh/aur"

  # ── Aggregate artefacts + SHA-256 subjects (feeds SLSA generator) ───
  # Issue #533: produce the base64-encoded subjects digest list that
  # the slsa-github-generator reusable workflow consumes to mint a
  # SLSA v1.1 Level 3 in-toto attestation per release artefact.
  subjects:
    name: aggregate subjects · sha256
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - id: hash
        name: Compute SHA-256 subjects payload
        run: |
          set -euo pipefail
          cd artifacts
          # The SLSA generator expects a base64-encoded multi-line
          # "<hex>  <filename>" digest list (the sha256sum -t format).
          # Only ship subjects for primary release artefacts — checksum
          # sidecars and detached signatures are not first-class subjects.
          shopt -s nullglob
          set +e
          payload=$(sha256sum \
            ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.pkg ./*.msi 2>/dev/null \
            | sed 's| \./|  |')
          set -e
          if [ -z "$payload" ]; then
            echo "::error::No release artefacts found to attest"
            exit 1
          fi
          echo "$payload"
          encoded=$(printf '%s' "$payload" | base64 -w0)
          echo "hashes=$encoded" >> "$GITHUB_OUTPUT"

  # ── SLSA v1.1 Level 3 build provenance (issue #533) ─────────────────
  # Reusable workflow is pinned to the tag (NOT a SHA) — this is a
  # documented invariant of slsa-github-generator: the generator
  # validates github.workflow_ref against its release tag to mint a
  # non-falsifiable buildType. SHA-pinning a reusable SLSA workflow
  # would cause the generator to refuse to emit a Level 3 attestation.
  # See: https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md
  slsa-provenance:
    name: slsa v1.1 provenance
    needs: [subjects]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.subjects.outputs.hashes }}
      provenance-name: ssg-${{ github.ref_name }}.intoto.jsonl
      upload-assets: true

  # ── Re-verify provenance post-release (catches silent breakage) ─────
  # AC: any release artefact + its sibling .intoto.jsonl must pass
  # `slsa-verifier verify-artifact`. If this job ever fails on green
  # release, the published attestation is unusable and the release
  # must be re-cut. Pinned to a SHA (this is a plain action, not a
  # reusable workflow, so SHA-pinning is the correct security posture).
  verify-provenance:
    name: verify slsa attestation
    needs: [slsa-provenance, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download release artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' \
            --pattern '*.zip' \
            --pattern '*.deb' \
            --pattern '*.rpm' \
            --pattern '*.pkg' \
            --pattern '*.msi' \
            --pattern '*.intoto.jsonl'
          ls -la

      - name: Verify every artefact against its provenance
        run: |
          set -euo pipefail
          cd verify
          shopt -s nullglob
          prov=$(find . -maxdepth 1 -name 'ssg-*.intoto.jsonl' -print -quit)
          if [ -z "$prov" ]; then
            echo "::error::No .intoto.jsonl provenance file found in release"
            exit 1
          fi
          failed=0
          for f in ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.pkg ./*.msi; do
            [ -f "$f" ] || continue
            echo "::group::verify $f"
            if slsa-verifier verify-artifact "$f" \
                 --provenance-path "$prov" \
                 --source-uri "github.com/$GITHUB_REPOSITORY" \
                 --source-tag "$GITHUB_REF_NAME"; then
              echo "ok: $f"
            else
              echo "::error::SLSA verification failed for $f"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed artefact(s) failed SLSA verification"
            exit 1
          fi

  # ── GitHub Release + crates.io publish ──────────────────────────
  publish:
    name: github release · crates.io
    needs: [build]
    # GHCR is best-effort (multi-arch builds can be flaky); don't gate
    # the GitHub Release or crates.io publish on it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release-body.md << 'BODY'
          ## Install

          **Homebrew (macOS / Linux):**
          ```sh
          brew install --formula https://raw.githubusercontent.com/sebastienrousseau/static-site-generator/main/packaging/homebrew/ssg.rb
          ```

          **One-liner (macOS / Linux):**
          ```sh
          curl -fsSL https://raw.githubusercontent.com/sebastienrousseau/static-site-generator/main/scripts/install.sh | sh
          ```

          **Cargo (any platform with Rust):**
          ```sh
          cargo install ssg
          ```

          **Debian / Ubuntu:**
          ```sh
          sudo apt install ./ssg_*_amd64.deb
          ```

          **Fedora / RHEL:**
          ```sh
          sudo rpm -i ssg-*.rpm
          ```

          **macOS (.pkg installer):**
          ```sh
          sudo installer -pkg ssg-*.pkg -target /
          ```

          **Windows (MSI):** download `ssg-*.msi`, double-click to install.

          **Arch Linux (AUR):**
          ```sh
          yay -S static-site-generator
          ```

          **Container (GHCR):**
          ```sh
          docker pull ghcr.io/sebastienrousseau/static-site-generator:latest
          ```

          ---

          ## Verify

          Each archive ships a `.sha256` checksum. Where the maintainer has
          published a GPG key, a `.asc` detached signature is also provided.

          ```sh
          shasum -a 256 -c ssg-*.tar.gz.sha256
          gpg --verify ssg-*.tar.gz.asc ssg-*.tar.gz   # if .asc present
          ```

          **SLSA v1.1 provenance (Level 3, Sigstore-signed):**

          ```sh
          # Install once: https://github.com/slsa-framework/slsa-verifier
          slsa-verifier verify-artifact ssg-*.tar.gz \
            --provenance-path ssg-*.intoto.jsonl \
            --source-uri github.com/sebastienrousseau/static-site-generator \
            --source-tag ${{ github.ref_name }}
          ```

          See [docs/security/sbom-provenance.md](https://github.com/sebastienrousseau/static-site-generator/blob/main/docs/security/sbom-provenance.md)
          for the full SBOM (CycloneDX + SPDX) and SLSA verification guide.

          ---

          BODY

          # Idempotent: create the release if it doesn't exist, else
          # edit-in-place and upload artifacts with --clobber. This
          # makes the job safe to re-run after a partial failure
          # (e.g. crates.io token rotation between attempts) without
          # the "release already exists" abort.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — updating in place"
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-body.md
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-body.md \
              --generate-notes \
              artifacts/*
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg
            artifacts/*.msi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Publish workspace sub-crates to crates.io (dep order)
        # `cargo publish -p ssg` fails if ssg-core / ssg-rpc-macro /
        # ssg-rpc / ssg-search at the matching version don't already
        # exist on crates.io (path deps are verified against the
        # registry). Publish them first, in dependency order:
        #
        #   ssg-core         (no internal deps)
        #   ssg-rpc-macro    (no internal deps)
        #   ssg-rpc          (depends on ssg-rpc-macro)
        #   ssg-search       (no internal deps)
        #
        # crates.io's index needs ~30s after each publish before the
        # next crate can depend on the freshly-published version, so
        # we sleep between calls. `--no-verify` skips the rebuild
        # against the registry (we already built + tested in earlier
        # CI phases) and shaves a few minutes off the wall clock.
        #
        # Idempotent retry: if a version is already on crates.io
        # (e.g. previous release run already published the sub-crate
        # and the workflow is being re-run), don't fail the build.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for c in ssg-core ssg-rpc-macro ssg-rpc ssg-search; do
            echo "::group::cargo publish -p $c"
            if cargo publish -p "$c" --locked --no-verify; then
              echo "✓ $c published"
            else
              ver=$(grep '^version = ' "crates/$c/Cargo.toml" | head -1 | cut -d'"' -f2)
              if curl -fsS "https://crates.io/api/v1/crates/$c/$ver" >/dev/null 2>&1; then
                echo "✓ $c $ver already on crates.io — continuing"
              else
                echo "::error::cargo publish -p $c failed and version not on crates.io"
                exit 1
              fi
            fi
            echo "::endgroup::"
            sleep 30
          done

      - name: Publish ssg to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ssg --locked
